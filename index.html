<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zemin Etüt - Saha Sondaj Kayıt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f1f5f9; padding-bottom: 60px; }
        header { background: #f59e0b; color: #020617; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 999; }
        header h1 { font-size: 18px; font-weight: 800; }
        header p { font-size: 11px; opacity: 0.85; }
        .btn-csv { background: #0f172a; color: #fbbf24; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
        main { max-width: 500px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; }
        #mapFrame { height: 250px; width: 100%; border: none; border-radius: 8px; background: #0f172a; display: block; }
        .gps-box { margin-top: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .gps-info { font-size: 12px; line-height: 1.6; color: #94a3b8; }
        .gps-val { color: #fbbf24; font-family: monospace; font-weight: 700; }
        .gps-acc { color: #34d399; font-family: monospace; font-weight: 700; }
        #gpsStatus { font-size: 11px; color: #38bdf8; margin-top: 2px; font-weight: 600; }
        .btn-gps { background: #f59e0b; color: #020617; border: none; padding: 10px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap; }
        h2 { font-size: 13px; color: #fbbf24; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .field { margin-bottom: 10px; }
        label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
        input[type="text"], input[type="number"] { width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; }
        input[type="file"] { width: 100%; font-size: 12px; color: #cbd5e1; }
        #previewImg { display: none; width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-top: 8px; border: 1px solid #475569; }
        .btn-save { width: 100%; background: #059669; color: #fff; border: none; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 6px; }
        .rec-item { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; display: flex; gap: 10px; margin-bottom: 10px; }
        .rec-img { width: 75px; height: 75px; object-fit: cover; border-radius: 8px; border: 1px solid #475569; flex-shrink: 0; }
        .rec-body { flex: 1; font-size: 12px; line-height: 1.5; }
        .rec-top { display: flex; justify-content: space-between; font-weight: 700; color: #fbbf24; }
        .btn-del { background: none; border: none; color: #f87171; font-weight: 700; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Saha Sondaj Takip</h1>
            <p>Zemin Etüt Veri Toplama</p>
        </div>
        <button type="button" class="btn-csv" id="csvBtn">Excel (CSV) İndir</button>
    </header>

    <main>
        <div class="card">
            <iframe id="mapFrame" src="https://google.com" loading="lazy"></iframe>
            <div class="gps-box">
                <div class="gps-info">
                    <div>Enlem (Lat): <span id="latVal" class="gps-val">-</span></div>
                    <div>Boylam (Lon): <span id="lonVal" class="gps-val">-</span></div>
                    <div>Hassasiyet: <span id="accVal" class="gps-acc">-</span></div>
                    <div id="gpsStatus">Sistem başlatılıyor...</div>
                </div>
                <button type="button" class="btn-gps" id="gpsBtn">Konum Al</button>
            </div>
        </div>

        <form id="boreholeForm" class="card">
            <h2>Yeni Sondaj Noktası Ekle</h2>
            <div class="row">
                <div>
                    <label>Ada / Parsel</label>
                    <input type="text" id="parcel" required placeholder="Örn: 104 / 12">
                </div>
                <div>
                    <label>Sondaj No</label>
                    <input type="text" id="skNo" required placeholder="Örn: SK-1">
                </div>
            </div>
            <div class="row">
                <div>
                    <label>Derinlik (m)</label>
                    <input type="number" step="0.5" id="depth" placeholder="Örn: 15">
                </div>
                <div>
                    <label>Yeraltı Suyu (m)</label>
                    <input type="number" step="0.1" id="waterLevel" placeholder="Yoksa boş">
                </div>
            </div>
            <div class="field">
                <label>Saha Notu</label>
                <input type="text" id="notes" placeholder="Zemin cinsi, karot durumu vb.">
            </div>
            <div class="field">
                <label>Sondaj Fotoğrafı (Otomatik Koordinat Basılır)</label>
                <input type="file" id="photoInput" accept="image/*" capture="environment">
                <img id="previewImg" />
            </div>
            <button type="submit" class="btn-save">Sondajı Kaydet</button>
        </form>

        <div>
            <h2>Kayıtlı Sondajlar (<span id="count">0</span>)</h2>
            <div id="recordsList"></div>
        </div>
    </main>

    <canvas id="watermarkCanvas" style="display:none;"></canvas>

    <script>
        var currentLat = null;
        var currentLon = null;
        var currentAcc = null;

        function ekranaKonumYaz(pos) {
            currentLat = pos.coords.latitude.toFixed(6);
            currentLon = pos.coords.longitude.toFixed(6);
            currentAcc = Math.round(pos.coords.accuracy) + " m";

            document.getElementById('latVal').innerText = currentLat;
            document.getElementById('lonVal').innerText = currentLon;
            document.getElementById('accVal').innerText = currentAcc;

            var statusEl = document.getElementById('gpsStatus');
            statusEl.innerText = "● Konum alındı (" + new Date().toLocaleTimeString('tr-TR') + ")";
            statusEl.style.color = "#34d399";

            // Doğrudan Google Uydu Haritasını konuma odakla ve kırmızı pin koy
            var mapUrl = "https://google.com" + currentLat + "," + currentLon + "&t=k&z=18&output=embed";
            document.getElementById('mapFrame').src = mapUrl;
        }

        function konumAl() {
            var statusEl = document.getElementById('gpsStatus');
            if (!navigator.geolocation) {
                statusEl.innerText = "Tarayıcı konum desteklemiyor.";
                statusEl.style.color = "#f87171";
                return;
            }
            statusEl.innerText = "Konum sorgulanıyor...";
            statusEl.style.color = "#fbbf24";

            navigator.geolocation.getCurrentPosition(
                ekranaKonumYaz,
                function() {},
                { enableHighAccuracy: false, timeout: 6000, maximumAge: 60000 }
            );

            navigator.geolocation.getCurrentPosition(
                ekranaKonumYaz,
                function(err) {
                    if (!currentLat) {
                        statusEl.innerText = "Hata (" + err.code + "): " + err.message;
                        statusEl.style.color = "#f87171";
                    }
                },
                { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
            );
        }

        document.getElementById('gpsBtn').addEventListener('click', konumAl);
        konumAl();
    </script>

    <script>
        var db = null;
        var processedPhotoDataUrl = null;
        var allRecordsCache = [];

        document.getElementById('photoInput').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(event) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.getElementById('watermarkCanvas');
                    var ctx = canvas.getContext('2d');
                    var maxDim = 1200;
                    var w = img.width;
                    var h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                        else { w = Math.round(w * maxDim / h); h = maxDim; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);

                    var barH = Math.max(60, h * 0.08);
                    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                    ctx.fillRect(0, h - barH, w, barH);

                    ctx.fillStyle = "#fbbf24";
                    var fSize = Math.max(16, Math.round(w * 0.025));
                    ctx.font = "bold " + fSize + "px sans-serif";
                    
                    var sk = document.getElementById('skNo').value || "Sondaj";
                    var parcel = document.getElementById('parcel').value || "-";
                    var dateStr = new Date().toLocaleString('tr-TR');
var coordStr = currentLat ? (currentLat + ", " + currentLon) : "Konum Yok";
ctx.fillText("Parsel: " + parcel + " | " + sk + " | " + dateStr, 15, h - barH + fSize + 5);
ctx.fillStyle = "#ffffff";
ctx.fillText("Koordinat: " + coordStr + " (" + (currentAcc || "-") + ")", 15, h - 12);
processedPhotoDataUrl = canvas.toDataURL('image/jpeg', 0.8);
var preview = document.getElementById('previewImg');
preview.src = processedPhotoDataUrl;
preview.style.display = "block";
};
img.src = event.target.result;
};
reader.readAsDataURL(file);
});
var reqDB = indexedDB.open("ZeminEtutDB", 1);
reqDB.onupgradeneeded = function(e) {
db = e.target.result;
db.createObjectStore("sondajlar", { keyPath: "id", autoIncrement: true });
};
reqDB.onsuccess = function(e) {
db = e.target.result;
renderRecords();
};
document.getElementById('boreholeForm').addEventListener('submit', function(e) {
e.preventDefault();
if (!currentLat) {
alert("Önce 'Konum Al' butonuna basarak koordinat alın.");
return;
}
var record = {
parcel: document.getElementById('parcel').value,
skNo: document.getElementById('skNo').value,
depth: document.getElementById('depth').value,
waterLevel: document.getElementById('waterLevel').value,
notes: document.getElementById('notes').value,
lat: currentLat,
lon: currentLon,
acc: currentAcc,
date: new Date().toLocaleString('tr-TR'),
photo: processedPhotoDataUrl
};
var tx = db.transaction("sondajlar", "readwrite");
tx.objectStore("sondajlar").add(record);
tx.oncomplete = function() {
document.getElementById('boreholeForm').reset();
document.getElementById('previewImg').style.display = "none";
processedPhotoDataUrl = null;
renderRecords();
alert("Sondaj kaydedildi!");
};
});
function renderRecords() {
if (!db) return;
var tx = db.transaction("sondajlar", "readonly");
tx.objectStore("sondajlar").getAll().onsuccess = function(e) {
var list = document.getElementById('recordsList');
allRecordsCache = e.target.result.reverse();
document.getElementById('count').innerText = allRecordsCache.length;
list.innerHTML = "";
allRecordsCache.forEach(function(r, idx) {
var card = document.createElement('div');
card.className = "rec-item";
var imgHtml = r.photo
? ''
: 'Foto Yok';
card.innerHTML = imgHtml +
'' +
'' + r.skNo + ' (Parsel: ' + r.parcel + ')' +
'Sil' +
'' + r.lat + ', ' + r.lon + '' +
'Derinlik: ' + (r.depth || '-') + 'm | YAS: ' + (r.waterLevel || '-') + 'm' +
(r.notes ? '"' + r.notes + '"' : '') +
'' + r.date + '';
list.appendChild(card);
});
};
}
function deleteRecord(id) {
if (!confirm("Silmek istediğinize emin misiniz?")) return;
var tx = db.transaction("sondajlar", "readwrite");
tx.objectStore("sondajlar").delete(id);
tx.oncomplete = renderRecords;
}
function downloadByIdx(idx) {
var r = allRecordsCache[idx];
if (!r || !r.photo) return;
var a = document.createElement('a');
a.href = r.photo;
a.download = (r.parcel + "" + r.skNo + ".jpg").replace(/\s+/g, '');
a.click();
}
document.getElementById('csvBtn').addEventListener('click', function() {
if (!db) return;
var tx = db.transaction("sondajlar", "readonly");
tx.objectStore("sondajlar").getAll().onsuccess = function(e) {
var records = e.target.result;
if (!records.length) return alert("Kayıt yok.");
var bom = String.fromCharCode(65279);
var csv = bom + "Ada/Parsel;Sondaj No;Enlem;Boylam;Hassasiyet;Derinlik (m);YAS (m);Notlar;Tarih\n";
records.forEach(function(r) {
csv += '"' + r.parcel + '";"' + r.skNo + '";"' + r.lat + '";"' + r.lon + '";"' + r.acc + '";"' + r.depth + '";"' + r.waterLevel + '";"' + r.notes + '";"' + r.date + '"\n';
});
var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
var a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = "Sondaj_Listesi_" + new Date().toISOString().slice(0,10) + ".csv";
a.click();
};
});
