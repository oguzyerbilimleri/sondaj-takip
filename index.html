<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zemin Etüt - Saha Sondaj Kayıt</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { height: 250px; width: 100%; border-radius: 0.75rem; z-index: 1; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 pb-20">

    <header class="bg-amber-500 text-slate-950 p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="font-bold text-lg leading-tight">Saha Sondaj Takip v2</h1>
            <p class="text-xs font-medium opacity-80">Zemin Etüt Veri Toplama</p>
        </div>
        <button type="button" onclick="exportCSV()" class="bg-slate-900 text-amber-400 text-xs font-bold px-3 py-2 rounded-lg shadow">
            Excel (CSV) İndir
        </button>
    </header>

    <main class="p-4 max-w-lg mx-auto space-y-4">

        <!-- Harita ve GPS Durumu -->
        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 shadow">
            <div id="map"></div>
            <div class="mt-3 flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-700 gap-2">
                <div class="text-xs space-y-1">
                    <div class="text-slate-400">Enlem (Lat): <span id="latVal" class="text-amber-400 font-mono font-bold">-</span></div>
                    <div class="text-slate-400">Boylam (Lon): <span id="lonVal" class="text-amber-400 font-mono font-bold">-</span></div>
                    <div class="text-slate-400">GPS Hassasiyeti: <span id="accVal" class="text-emerald-400 font-mono">-</span></div>
                    <div id="gpsStatus" class="text-[11px] text-amber-300 font-medium">Hazır - Konum isteniyor...</div>
                </div>
                <button type="button" onclick="konumAl()" class="bg-amber-500 active:bg-amber-600 text-slate-950 font-bold text-xs px-3 py-2.5 rounded-lg shrink-0">
                    Konum Al
                </button>
            </div>
        </div>

        <!-- Yeni Sondaj Formu -->
        <form id="boreholeForm" class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 shadow">
            <h2 class="font-bold text-amber-400 text-sm uppercase tracking-wider">Yeni Sondaj Noktası Ekle</h2>
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Ada / Parsel</label>
                    <input type="text" id="parcel" required placeholder="Örn: 104 / 12" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Sondaj No</label>
                    <input type="text" id="skNo" required placeholder="Örn: SK-1" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Derinlik (m)</label>
                    <input type="number" step="0.5" id="depth" placeholder="Örn: 15" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Yeraltı Suyu (m)</label>
                    <input type="number" step="0.1" id="waterLevel" placeholder="Yoksa boş" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Saha Notu</label>
                <input type="text" id="notes" placeholder="Zemin cinsi, karot durumu vb." class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-sm">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Sondaj Fotoğrafı</label>
                <input type="file" id="photoInput" accept="image/*" capture="environment" class="block w-full text-xs text-slate-300 file:mr-3 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-slate-700 file:text-amber-400">
                <img id="previewImg" class="hidden mt-2 rounded-lg max-h-48 w-full object-cover border border-slate-600" />
            </div>

            <button type="submit" class="w-full bg-emerald-600 active:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm shadow-lg">
                Sondajı Kaydet
            </button>
        </form>

        <!-- Kayıtlı Sondajlar -->
        <div class="space-y-2">
            <h2 class="font-bold text-slate-300 text-sm uppercase tracking-wider px-1">Kayıtlı Sondajlar (<span id="count">0</span>)</h2>
            <div id="recordsList" class="space-y-3"></div>
        </div>

    </main>

    <canvas id="watermarkCanvas" class="hidden"></canvas>

    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById('gpsStatus').innerText = "Kod Hatası (Satır " + line + "): " + msg;
        };

        var currentLat = null, currentLon = null, currentAcc = null;
        var map = null, marker = null, db = null;
        var processedPhotoDataUrl = null;

        // Harita Kurulumu
        try {
            map = L.map('map').setView([38.3687, 34.0370], 11);
            L.tileLayer('https://arcgisonline.com{z}/{y}/{x}', {
                attribution: 'Esri'
            }).addTo(map);
        } catch (e) {
            document.getElementById('gpsStatus').innerText = "Harita yüklenemedi: " + e.message;
        }

        function konumAl() {
            var statusEl = document.getElementById('gpsStatus');
            if (!navigator.geolocation) {
                statusEl.innerText = "Tarayıcı konum desteklemiyor.";
                return;
            }
            statusEl.innerText = "Konum sorgulanıyor...";

            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    currentLat = pos.coords.latitude.toFixed(6);
                    currentLon = pos.coords.longitude.toFixed(6);
                    currentAcc = Math.round(pos.coords.accuracy) + " m";

                    document.getElementById('latVal').innerText = currentLat;
                    document.getElementById('lonVal').innerText = currentLon;
                    document.getElementById('accVal').innerText = currentAcc;
                    statusEl.innerText = "● Konum alındı (" + new Date().toLocaleTimeString('tr-TR') + ")";
                    statusEl.className = "text-[11px] text-emerald-400 font-bold";

                    if (map) {
                        var ll = [parseFloat(currentLat), parseFloat(currentLon)];
                        map.setView(ll, 18);
                        if (marker) marker.setLatLng(ll);
                        else marker = L.marker(ll).addTo(map);
                    }
                },
                function(err) {
                    statusEl.innerText = "Hata (" + err.code + "): " + err.message;
                    statusEl.className = "text-[11px] text-rose-400 font-bold";
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // Sayfa açılınca otomatik konum al
        konumAl();

        // Fotoğraf ve Filigran
        document.getElementById('photoInput').addEventListener('change', function(e) {
            var file = e.target.files;
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(event) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.getElementById('watermarkCanvas');
                    var ctx = canvas.getContext('2d');
                    var maxDim = 1200;
                    var w = img.width, h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                        else { w = Math.round(w * maxDim / h); h = maxDim; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);

                    var barH = Math.max(60, h * 0.08);
                    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                    ctx.fillRect(0, h - barH, w, barH);

                    ctx.fillStyle = "#fbbf24";
                    var fSize = Math.max(16, Math.round(w * 0.025));
                    ctx.font = "bold " + fSize + "px sans-serif";
                    
                    var sk = document.getElementById('skNo').value || "Sondaj";
                    var parcel = document.getElementById('parcel').value || "-";
                    var dateStr = new Date().toLocaleString('tr-TR');
                    var coordStr = currentLat ? (currentLat + ", " + currentLon) : "Konum Yok";

                    ctx.fillText("Parsel: " + parcel + " | " + sk + " | " + dateStr, 15, h - barH + fSize + 5);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText("Koordinat: " + coordStr + " (" + (currentAcc || "-") + ")", 15, h - 12);

                    processedPhotoDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    var preview = document.getElementById('previewImg');
                    preview.src = processedPhotoDataUrl;
preview.classList.remove('hidden');
};
img.src = event.target.result;
};
reader.readAsDataURL(file);
});
// IndexedDB Veritabanı
var reqDB = indexedDB.open("ZeminEtutDB", 1);
reqDB.onupgradeneeded = function(e) {
db = e.target.result;
db.createObjectStore("sondajlar", { keyPath: "id", autoIncrement: true });
};
reqDB.onsuccess = function(e) {
db = e.target.result;
renderRecords();
};
// Kaydetme
document.getElementById('boreholeForm').addEventListener('submit', function(e) {
e.preventDefault();
if (!currentLat) {
alert("Önce 'Konum Al' butonuna basarak koordinat alın.");
return;
}
var record = {
parcel: document.getElementById('parcel').value,
skNo: document.getElementById('skNo').value,
depth: document.getElementById('depth').value,
waterLevel: document.getElementById('waterLevel').value,
notes: document.getElementById('notes').value,
lat: currentLat,
lon: currentLon,
acc: currentAcc,
date: new Date().toLocaleString('tr-TR'),
photo: processedPhotoDataUrl
};
var tx = db.transaction("sondajlar", "readwrite");
tx.objectStore("sondajlar").add(record);
tx.oncomplete = function() {
document.getElementById('boreholeForm').reset();
document.getElementById('previewImg').classList.add('hidden');
processedPhotoDataUrl = null;
renderRecords();
alert("Sondaj kaydedildi!");
};
});
function renderRecords() {
if (!db) return;
var tx = db.transaction("sondajlar", "readonly");
tx.objectStore("sondajlar").getAll().onsuccess = function(e) {
var list = document.getElementById('recordsList');
var records = e.target.result.reverse();
document.getElementById('count').innerText = records.length;
list.innerHTML = "";
records.forEach(function(r) {
var card = document.createElement('div');
card.className = "bg-slate-800 p-3 rounded-xl border border-slate-700 flex gap-3 items-start";
var imgHtml = r.photo
? ''
: 'Foto Yok';
card.innerHTML = imgHtml +
'' +
'' + r.skNo + ' (Parsel: ' + r.parcel + ')' +
'Sil' +
'' + r.lat + ', ' + r.lon + '' +
'Derinlik: ' + (r.depth || '-') + 'm | YAS: ' + (r.waterLevel || '-') + 'm' +
(r.notes ? '"' + r.notes + '"' : '') +
'' + r.date + '';
list.appendChild(card);
});
};
}
function deleteRecord(id) {
if (!confirm("Silmek istediğinize emin misiniz?")) return;
var tx = db.transaction("sondajlar", "readwrite");
tx.objectStore("sondajlar").delete(id);
tx.oncomplete = renderRecords;
}
function downloadPhoto(dataUrl, filename) {
var a = document.createElement('a');
a.href = dataUrl;
a.download = filename.replace(/\s+/g, '_');
a.click();
}
function exportCSV() {
var tx = db.transaction("sondajlar", "readonly");
tx.objectStore("sondajlar").getAll().onsuccess = function(e) {
var records = e.target.result;
if (!records.length) return alert("Kayıt yok.");
var csv = "\uFEFFAda/Parsel;Sondaj No;Enlem;Boylam;Hassasiyet;Derinlik (m);YAS (m);Notlar;Tarih\n";
records.forEach(function(r) {
csv += '"' + r.parcel + '";"' + r.skNo + '";"' + r.lat + '";"' + r.lon + '";"' + r.acc + '";"' + r.depth + '";"' + r.waterLevel + '";"' + r.notes + '";"' + r.date + '"\n';
});
var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
var a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = "Sondaj_Listesi_" + new Date().toISOString().slice(0,10) + ".csv";
a.click();
};
}
